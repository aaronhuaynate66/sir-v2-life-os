name: Deploy watch (main vs producción)

# POR QUÉ EXISTE
# "mergeado" no significa "en producción". Pasó el 1-ago (seis PRs con CI verde y
# producción congelada) y volvió a pasar el 4-ago: Vercel rechazó #1100 con
# "Deployment rate limited — retry in 24 hours" en el mismo minuto del merge.
# CI verde, migración aplicada, E2E verde... y el código sin desplegar 17 horas.
# Nadie avisó. Aaron se enteraba mirando el sha a mano.
#
# Este workflow compara el sha de `main` contra el sha de lo que Vercel está
# sirviendo de verdad y avisa cuando divergen.
#
# VIVE EN GITHUB ACTIONS, NO EN VERCEL — A PROPÓSITO
# Un detector no puede depender de la señal que solo produce su propio arreglo.
# Si esto fuera un cron de Vercel (`/api/cron/...`), un deploy trabado lo dejaría
# congelado junto con todo lo demás: el vigilante se apagaría justo cuando hace
# falta. Acá corre en el runner de GitHub, que no sabe nada de Vercel.
#
# HONESTIDAD DE COBERTURA
# Si no puede leer el estado de producción, avisa que está CIEGO. Nunca concluye
# "todo bien" desde una vista vacía.

on:
  # EL MOMENTO QUE IMPORTA ES EL MERGE, NO LA MEDIA HORA SIGUIENTE
  # Vercel escribe el rechazo del rate limit en el status del commit dentro del
  # minuto del push (medido el 5-ago: merge 19:48, status `failure` 19:47:41Z).
  # Con solo el cron, ese rechazo esperaba a la próxima corrida para verse: el
  # 5-ago el merge fue a las 19:48 y el aviso salió 20:44 — 56 min tarde.
  push:
    branches: [main]
  schedule:
    # Cada 30 min, a los 9 y los 39. NO a los :00 — GitHub documenta que las
    # corridas programadas se atrasan en los picos de carga y "el inicio de cada
    # hora" es el pico. Medido el 5-ago con `*/30`: los intervalos REALES fueron
    # 101, 90, 76 y 88 min, o sea que se saltaban corridas enteras. Un vigilante
    # que llega cada hora y media llega tarde.
    - cron: "9,39 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  statuses: read
  issues: write

concurrency:
  group: deploy-watch
  cancel-in-progress: false

jobs:
  watch:
    name: ¿Está vivo lo que mergeamos?
    runs-on: ubuntu-latest
    # 10, no 5: la espera del veredicto de Vercel puede sumar 2 min a lo que ya
    # tardaba recorrer los deployments.
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TG_TOKEN: ${{ secrets.TELEGRAM_DEV_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_DEV_CHAT_ID }}
      # Gracia antes de gritar: un deploy sano tarda pocos minutos. Por debajo de
      # esto la deriva es "está desplegando", no "está trabado".
      GRACE_MINUTES: "25"
      # Marcador en el cuerpo del issue. NO usamos labels para identificarlo:
      # GitHub descarta `labels` en silencio si el token no tiene push access
      # (pasó de verdad — #826, #993, #994 quedaron sin label y una consulta
      # filtrada devolvió [] con tres pedidos esperando). El cuerpo no miente.
      MARKER: "<!-- deploy-watch -->"

    steps:
      - name: Comparar main contra lo que Vercel sirve
        run: |
          set -euo pipefail

          # --- Telegram: fail-open. Sin secrets no notifica, pero no rompe. ---
          notify() {
            if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then
              echo "TELEGRAM_DEV_* no configurados — skip (fail-open)"
              return 0
            fi
            curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT}" \
              --data-urlencode "text=$1" \
              -d "disable_web_page_preview=true" \
              -o /dev/null -w "telegram: HTTP %{http_code}\n"
          }

          # Minutos → texto legible. Antes se imprimía "26 min (~0 h)": la división
          # entera daba 0 y el paréntesis no aportaba nada, solo ruido.
          human_age() {
            local m=$1 h r
            if [ "$m" -lt 60 ]; then printf '%s min' "$m"; return; fi
            h=$(( m / 60 )); r=$(( m % 60 ))
            if [ "$r" -eq 0 ]; then printf '%s h' "$h"; else printf '%s h %s min' "$h" "$r"; fi
          }

          # Busca el issue del vigilante leyendo TODOS los issues abiertos y
          # mirando el cuerpo. Misma regla que la bandeja de Telegram en
          # CLAUDE.md: no concluir desde una vista filtrada.
          find_issue() {
            gh issue list --repo "$REPO" --state open --limit 100 \
              --json number,body \
              --jq "[.[] | select(.body != null and (.body | contains(\"$MARKER\")))][0].number // empty"
          }

          MAIN_SHA=$(gh api "repos/$REPO/commits/main" --jq '.sha')
          MAIN_DATE=$(gh api "repos/$REPO/commits/main" --jq '.commit.committer.date')
          MAIN_TITLE=$(gh api "repos/$REPO/commits/main" --jq '.commit.message' | head -n1)

          # Lo que Vercel sirve de verdad: el deployment de Production más
          # reciente cuyo último status sea `success`. Un deployment creado que
          # después falló NO está sirviendo nada.
          PROD_SHA=""
          PROD_AT=""
          for id in $(gh api "repos/$REPO/deployments?environment=Production&per_page=10" --jq '.[].id'); do
            state=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=1" --jq '.[0].state // empty')
            if [ "$state" = "success" ]; then
              PROD_SHA=$(gh api "repos/$REPO/deployments/$id" --jq '.sha')
              PROD_AT=$(gh api "repos/$REPO/deployments/$id" --jq '.created_at')
              break
            fi
          done

          ISSUE=$(find_issue)

          # --- CIEGO: no pudimos leer ningún Production exitoso. -------------
          # Esto NO es "todo bien". Puede ser que Vercel dejó de registrar
          # deployments en GitHub, que cambió el nombre del environment, o que
          # el token perdió permisos. Se avisa como falla, no como silencio.
          if [ -z "$PROD_SHA" ]; then
            echo "::warning::No se pudo leer ningún deployment de Production exitoso."
            if [ -z "$ISSUE" ]; then
              BODY=$(printf '%s\n\n**El vigilante está ciego.**\n\nNo encuentro ningún deployment de `Production` con status `success` en los últimos 10. Eso no quiere decir que producción esté bien: quiere decir que no la puedo ver.\n\nCausas posibles: Vercel dejó de registrar deployments en GitHub, el environment cambió de nombre, o el token perdió permisos.\n\n- `main`: `%s`\n\n_Abierto por el workflow `deploy-watch`._' "$MARKER" "${MAIN_SHA:0:8}")
              gh issue create --repo "$REPO" \
                --title "⚠️ No puedo ver el estado de producción" \
                --body "$BODY" >/dev/null
              notify "$(printf '🙈 El vigilante de deploys está ciego\nNo veo ningún deployment de Production exitoso. No es que esté todo bien: es que no lo puedo ver.\nTe dejé un issue en el repo con el detalle.')"
            fi
            exit 0
          fi

          echo "main:       $MAIN_SHA  ($MAIN_DATE)"
          echo "producción: $PROD_SHA  ($PROD_AT)"

          # --- AL DÍA ---------------------------------------------------------
          if [ "$MAIN_SHA" = "$PROD_SHA" ]; then
            echo "Producción está al día."
            if [ -n "$ISSUE" ]; then
              gh issue close "$ISSUE" --repo "$REPO" \
                --comment "Producción se puso al día: \`${MAIN_SHA:0:8}\` ya está sirviendo." >/dev/null
              notify "$(printf '✅ Producción se puso al día\n%s\nYa está vivo lo que estaba trabado.' "${MAIN_SHA:0:8}")"
            fi
            exit 0
          fi

          # --- DERIVA: ¿es "desplegando" o es "trabado"? ----------------------
          NOW_TS=$(date -u +%s)
          MAIN_TS=$(date -u -d "$MAIN_DATE" +%s)
          AGE_MIN=$(( (NOW_TS - MAIN_TS) / 60 ))

          # El motivo real, en las palabras de Vercel. Se lee ANTES de la gracia a
          # propósito (antes se leía después): un `failure` de Vercel no es
          # ambiguo, y esperar la gracia para reportar algo que ya se sabe es
          # regalarle esos minutos al silencio.
          #
          # Se toma el status MÁS RECIENTE, no el primero del array: en un mismo
          # commit puede haber más de un status de Vercel, y quedarse con uno
          # viejo hace avisar de un episodio ya cerrado o perderse el fresco.
          leer_estado() {
            gh api "repos/$REPO/commits/$MAIN_SHA/status" \
              --jq '[.statuses[] | select(.context | test("vercel"; "i"))]
                    | sort_by(.updated_at) | last | .state // "sin-status"'
          }
          leer_desc() {
            gh api "repos/$REPO/commits/$MAIN_SHA/status" \
              --jq '[.statuses[] | select(.context | test("vercel"; "i"))]
                    | sort_by(.updated_at) | last | .description // "sin descripción"'
          }

          # En la corrida por `push` el veredicto de Vercel todavía no existe: primero
          # escribe `pending` ("Vercel is deploying your app") y recién dentro del
          # minuto siguiente aparece el `failure` del rate limit. Sin esta espera, la
          # corrida del merge veía `pending`, se iba por la gracia, y el rechazo
          # quedaba esperando al cron. Hasta 2 min; si sigue ambiguo, se sale
          # tranquilo y el cron se encarga.
          V_STATE=$(leer_estado)
          for _ in 1 2 3 4 5 6; do
            case "$V_STATE" in
              failure|error|success) break ;;
              *) sleep 20; V_STATE=$(leer_estado) ;;
            esac
          done
          V_DESC=$(leer_desc)

          # La gracia solo cubre lo AMBIGUO. Si Vercel ya dijo que falló, la deriva
          # no es "está desplegando": es que NO va a desplegar.
          if [ "$AGE_MIN" -lt "$GRACE_MINUTES" ] && [ "$V_STATE" != "failure" ] && [ "$V_STATE" != "error" ]; then
            echo "Deriva de $AGE_MIN min — dentro de la gracia ($GRACE_MINUTES) y Vercel dice '$V_STATE'. Probablemente esté desplegando."
            exit 0
          fi

          AGE_LABEL=$(human_age "$AGE_MIN")
          echo "::error::Producción está atrás de main hace ${AGE_LABEL}. Vercel: $V_STATE — $V_DESC"

          # El cuerpo se arma SIEMPRE, exista o no el issue. Antes se armaba dentro
          # del `if [ -z "$ISSUE" ]`, así que un episodio abierto congelaba su título
          # y su tabla en el sha del primer minuto y no se movían más.
          #
          # Costó una lectura falsa el 7-ago-2026: el issue seguía titulado
          # "🔴 Producción está atrás de main (5a763ba5 no está vivo)" horas después
          # de que 5a763ba5 estuviera vivo. El episodio SÍ seguía abierto —main había
          # avanzado— pero el commit que el título acusaba ya había desplegado. Leído
          # de la lista de issues, decía exactamente lo contrario de la verdad.
          #
          # Es el mismo comentario de tres líneas más abajo, ahora cumplido: el aviso
          # es la TRANSICIÓN (Telegram, una vez) y el issue es el ESTADO (se reescribe
          # en cada corrida). Va con la hora de la última revisión, porque un aviso sin
          # fecha se lee como "ahora".
          REVISADO=$(date -u '+%Y-%m-%d %H:%M UTC')
          BODY=$(printf '%s\n\n**Producción está atrás de `main`.**\n\n| | |\n|---|---|\n| `main` | `%s` — %s |\n| sirviendo | `%s` (desde %s) |\n| deriva | %s |\n| Vercel dice | `%s` — %s |\n| última revisión | %s |\n\nEl código está mergeado y con CI verde, pero **no está vivo**. Este issue se reescribe en cada corrida y se cierra solo cuando producción se ponga al día.\n\n_Abierto por el workflow `deploy-watch`._' \
            "$MARKER" "${MAIN_SHA:0:8}" "$MAIN_TITLE" "${PROD_SHA:0:8}" "$PROD_AT" "$AGE_LABEL" "$V_STATE" "$V_DESC" "$REVISADO")
          TITULO="🔴 Producción está atrás de main (${MAIN_SHA:0:8} no está vivo)"

          if [ -z "$ISSUE" ]; then
            gh issue create --repo "$REPO" --title "$TITULO" --body "$BODY" >/dev/null
            # Un solo Telegram por episodio: el aviso es la transición, el issue
            # es el estado. Si esto avisara en cada corrida, 17 horas trabado
            # serían 34 mensajes y el aviso se volvería ruido que se ignora.
            notify "$(printf '🔴 Mergeado NO está en producción\n%s\n%s\n\nVercel: %s — %s\nSirviendo todavía: %s (hace %s)\n\nTe dejé un issue en el repo con el detalle.' \
              "${MAIN_SHA:0:8}" "$MAIN_TITLE" "$V_STATE" "$V_DESC" "${PROD_SHA:0:8}" "$AGE_LABEL")"
          else
            PREV=$(gh issue view "$ISSUE" --repo "$REPO" --json body --jq '.body // ""')
            gh issue edit "$ISSUE" --repo "$REPO" --title "$TITULO" --body "$BODY" >/dev/null
            # Se comenta SOLO cuando se sumó un commit nuevo a la espera. Comentar en
            # cada corrida serían 34 comentarios en 17 horas trabado: el mismo ruido
            # que el Telegram evita, mudado al issue. El cuerpo ya lleva el estado.
            case "$PREV" in
              *"${MAIN_SHA:0:8}"*) echo "Mismo sha que la corrida anterior: cuerpo actualizado, sin comentario." ;;
              *) gh issue comment "$ISSUE" --repo "$REPO" \
                   --body "Se sumó \`${MAIN_SHA:0:8}\` a la espera — ${MAIN_TITLE}. Sirviendo todavía \`${PROD_SHA:0:8}\`, deriva ${AGE_LABEL}. Vercel: \`${V_STATE}\` — ${V_DESC}" >/dev/null ;;
            esac
          fi

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Deploy watch"
            echo ""
            echo "Compara el sha de \`main\` contra el deployment de \`Production\` que Vercel sirve."
            echo "Corre en Actions a propósito: un deploy trabado no puede apagar a su propio vigilante."
          } >> "$GITHUB_STEP_SUMMARY"
